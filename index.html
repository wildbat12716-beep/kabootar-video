<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075e43">
  <title>کبوتر ویدئو | حساب کاربری</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f0f8f3;
      color: #173b2c;
    }

    header {
      background: #075e43;
      color: white;
      padding: 22px;
      text-align: center;
    }

    .logo {
      font-size: 26px;
      color: #79ffc0;
      font-weight: bold;
    }

    main {
      max-width: 460px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 17px;
      box-shadow: 0 5px 20px #0000000b;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 10px;
      font: inherit;
    }

    input {
      border: 1px solid #cadfd1;
      outline-color: #009b63;
    }

    button {
      border: none;
      background: #009b63;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #e3f5e9;
      color: #075e43;
    }

    button:disabled { opacity: .6; }

    .hidden { display: none !important; }

    #message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .error {
      background: #ffe5e5;
      color: #a00000;
    }

    .success {
      background: #e0f8e9;
      color: #075e43;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #60756a;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">🕊️ کبوتر ویدئو</div>
    <p>حساب واقعی خودت را بساز</p>
  </header>

  <main>
    <section class="card" id="authPanel">
      <h2 id="formTitle">ساخت حساب کاربری</h2>

      <form id="authForm">
        <input
          id="displayName"
          type="text"
          placeholder="نام نمایشی"
          minlength="3"
          maxlength="30"
          autocomplete="nickname"
          required
        >

        <input
          id="email"
          type="email"
          placeholder="ایمیل"
          autocomplete="email"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="رمز عبور؛ حداقل ۱۰ کاراکتر"
          minlength="10"
          maxlength="128"
          autocomplete="new-password"
          required
        >

        <button id="submitBtn" type="submit">ساخت حساب</button>
      </form>

      <button id="switchBtn" class="secondary" type="button">
        قبلاً حساب دارم؛ ورود
      </button>

      <button id="resetBtn" class="secondary" type="button">
        بازیابی رمز عبور
      </button>

      <div id="message" aria-live="polite"></div>
    </section>

    <section class="card hidden" id="accountPanel">
      <h2>✅ حساب کاربری</h2>
      <p id="welcome"></p>
      <p id="accountEmail"></p>
      <p id="verificationStatus"></p>

      <button id="verifyBtn" class="secondary">
        ارسال ایمیل تأیید
      </button>

      <button id="logoutBtn">خروج از حساب</button>
    </section>
  </main>

  <footer>کبوتر ویدئو © ۱۴۰۵</footer>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      sendEmailVerification,
      updateProfile,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgFjWFABZ7XpY1xRT_ULl4OmXsxbD-2SU",
      authDomain: "kabootar-video-80770.firebaseapp.com",
      projectId: "kabootar-video-80770",
      storageBucket: "kabootar-video-80770.firebasestorage.app",
      messagingSenderId: "799590320684",
      appId: "1:799590320684:web:9c7eb2ffd4da84411b1f89",
      measurementId: "G-N3VY5BJ0BD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const $ = id => document.getElementById(id);

    let loginMode = false;

    function showMessage(text, error = false) {
      $("message").textContent = text;
      $("message").className = error ? "error" : "success";
    }

    function setMode() {
      $("formTitle").textContent = loginMode
        ? "ورود به حساب"
        : "ساخت حساب کاربری";

      $("submitBtn").textContent = loginMode
        ? "ورود"
        : "ساخت حساب";

      $("switchBtn").textContent = loginMode
        ? "حساب ندارم؛ ثبت‌نام"
        : "قبلاً حساب دارم؛ ورود";

      $("displayName").classList.toggle("hidden", loginMode);
      $("displayName").required = !loginMode;

      $("password").autocomplete = loginMode
        ? "current-password"
        : "new-password";

      $("message").textContent = "";
      $("message").className = "";
    }

    $("switchBtn").addEventListener("click", () => {
      loginMode = !loginMode;
      setMode();
    });

    $("authForm").addEventListener("submit", async event => {
      event.preventDefault();

      const email = $("email").value.trim();
      const password = $("password").value;
      const displayName = $("displayName").value.trim();

      if (!loginMode && displayName.length < 3) {
        showMessage("نام نمایشی باید حداقل ۳ کاراکتر باشد.", true);
        return;
      }

      if (password.length < 10) {
        showMessage("رمز عبور باید حداقل ۱۰ کاراکتر باشد.", true);
        return;
      }

      $("submitBtn").disabled = true;

      try {
        if (loginMode) {
          await signInWithEmailAndPassword(auth, email, password);
          showMessage("ورود موفق بود.");
        } else {
          const result = await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

          await updateProfile(result.user, {
            displayName
          });

          await sendEmailVerification(result.user);

          showMessage(
            "حساب ساخته شد! برای تأیید حساب، ایمیل خود را بررسی کن."
          );
        }
      } catch (error) {
        const messages = {
          "auth/email-already-in-use": "این ایمیل قبلاً ثبت شده است.",
          "auth/invalid-email": "ایمیل معتبر نیست.",
          "auth/invalid-credential": "ایمیل یا رمز عبور اشتباه است.",
          "auth/weak-password": "رمز عبور پذیرفته نشد؛ رمز قوی‌تری انتخاب کن.",
          "auth/too-many-requests": "تعداد تلاش‌ها زیاد است؛ بعداً دوباره امتحان کن.",
          "auth/network-request-failed": "اتصال اینترنت را بررسی کن.",
          "auth/operation-not-allowed": "ورود با ایمیل در Firebase فعال نشده است.",
          "auth/unauthorized-domain": "دامنه سایت در Firebase مجاز نیست."
        };

        showMessage(
          messages[error.code] || "خطا: " + error.message,
          true
        );
      } finally {
        $("submitBtn").disabled = false;
      }
    });

    $("resetBtn").addEventListener("click", async () => {
      const email = $("email").value.trim();

      if (!email) {
        showMessage("ابتدا ایمیل خود را وارد کن.", true);
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        showMessage(
          "اگر امکان بازیابی وجود داشته باشد، ایمیل بازیابی ارسال می‌شود."
        );
      } catch (error) {
        showMessage("ارسال ایمیل بازیابی ناموفق بود.", true);
      }
    });

    $("verifyBtn").addEventListener("click", async () => {
      if (!auth.currentUser) return;

      try {
        await sendEmailVerification(auth.currentUser);
        showMessage("ایمیل تأیید ارسال شد.");
      } catch (error) {
        showMessage("ارسال ایمیل تأیید ناموفق بود.", true);
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      try {
        await signOut(auth);
        showMessage("از حساب خارج شدی.");
      } catch (error) {
        showMessage("خروج ناموفق بود.", true);
      }
    });

    onAuthStateChanged(auth, user => {
      if (user) {
        $("authPanel").classList.add("hidden");
        $("accountPanel").classList.remove("hidden");

        $("welcome").textContent =
          "خوش آمدی، " + (user.displayName || "کاربر") + " 🕊️";

        $("accountEmail").textContent = "ایمیل: " + user.email;

        $("verificationStatus").textContent = user.emailVerified
          ? "ایمیل تأیید شده است."
          : "ایمیل هنوز تأیید نشده است.";
      } else {
        $("accountPanel").classList.add("hidden");
        $("authPanel").classList.remove("hidden");
      }
    });

    setMode();
  </script>
</body>
</html>
